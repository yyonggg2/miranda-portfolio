<!doctype html>
<html lang="zh">
  <head>
    <!--meta lines: make sure different languages fits in, make sure it can adjust the window size based on the screen-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miranda Yong</title>
    <!-- 像素字体 Press Start 2P(来自 Google Fonts),悬停时底下那行字用它 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- 给 Three.js 起个短名字 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- 3D 画面会放在这里 -->
    <div id="app"></div>

    <!-- 明暗切换按钮:暗色时是一弯月亮,亮色时是太阳。图标是用 SVG 画的,切成一块块深浅不同的三角形,和 3D 的低多边形风格一致 -->
    <button id="theme-toggle" type="button" aria-label="切换明暗模式">
      <svg class="icon-moon" viewBox="0 0 32 32" aria-hidden="true">
        <!-- 弯月:切成很多块三角形,每一块颜色深浅不同,像 3D 的切面 -->
        <polygon points="14,2.1 6.5,5.7 10.7,6.4" fill="#fffbe6" />
        <polygon points="14,2.1 10.7,6.4 14,2.1" fill="#f7d98c" />
        <polygon points="6.5,5.7 2.3,13 9.5,11.6" fill="#fffbe6" />
        <polygon points="6.5,5.7 9.5,11.6 10.7,6.4" fill="#f7d98c" />
        <polygon points="2.3,13 3,21.2 10.7,16.8" fill="#fffbe6" />
        <polygon points="2.3,13 10.7,16.8 9.5,11.6" fill="#f7d98c" />
        <polygon points="3,21.2 8.3,27.7 14.1,21" fill="#fffbe6" />
        <polygon points="3,21.2 14.1,21 10.7,16.8" fill="#f7d98c" />
        <polygon points="8.3,27.7 16.3,30 19,23.2" fill="#fffbe6" />
        <polygon points="8.3,27.7 19,23.2 14.1,21" fill="#f7d98c" />
        <polygon points="16.3,30 24.2,27.4 24.4,23.1" fill="#fffbe6" />
        <polygon points="16.3,30 24.4,23.1 19,23.2" fill="#f7d98c" />
        <polygon points="24.2,27.4 29.2,20.7 29.2,20.7" fill="#fffbe6" />
        <polygon points="24.2,27.4 29.2,20.7 24.4,23.1" fill="#f7d98c" />
      </svg>
      <svg class="icon-sun" viewBox="0 0 32 32" aria-hidden="true">
        <!-- 太阳:中间八块三角形拼成八边形,周围八个光芒,每个光芒一半亮一半暗 -->
        <polygon points="16,16 18.8,9.3 22.7,13.2" fill="#ffd23f" />
        <polygon points="16,16 22.7,13.2 22.7,18.8" fill="#ffc233" />
        <polygon points="16,16 22.7,18.8 18.8,22.7" fill="#ffb703" />
        <polygon points="16,16 18.8,22.7 13.2,22.7" fill="#ffa60a" />
        <polygon points="16,16 13.2,22.7 9.3,18.8" fill="#ffcb47" />
        <polygon points="16,16 9.3,18.8 9.3,13.2" fill="#ffbb1f" />
        <polygon points="16,16 9.3,13.2 13.2,9.3" fill="#ffae05" />
        <polygon points="16,16 13.2,9.3 18.8,9.3" fill="#ffe066" />
        <polygon points="16,0.8 13.4,6.4 16,6.4" fill="#ffd23f" />
        <polygon points="16,0.8 16,6.4 18.6,6.4" fill="#ff9f1c" />
        <polygon points="26.7,5.3 20.9,7.4 22.8,9.2" fill="#ffd23f" />
        <polygon points="26.7,5.3 22.8,9.2 24.6,11.1" fill="#ff9f1c" />
        <polygon points="31.2,16 25.6,13.4 25.6,16" fill="#ffd23f" />
        <polygon points="31.2,16 25.6,16 25.6,18.6" fill="#ff9f1c" />
        <polygon points="26.7,26.7 24.6,20.9 22.8,22.8" fill="#ffd23f" />
        <polygon points="26.7,26.7 22.8,22.8 20.9,24.6" fill="#ff9f1c" />
        <polygon points="16,31.2 18.6,25.6 16,25.6" fill="#ffd23f" />
        <polygon points="16,31.2 16,25.6 13.4,25.6" fill="#ff9f1c" />
        <polygon points="5.3,26.7 11.1,24.6 9.2,22.8" fill="#ffd23f" />
        <polygon points="5.3,26.7 9.2,22.8 7.4,20.9" fill="#ff9f1c" />
        <polygon points="0.8,16 6.4,18.6 6.4,16" fill="#ffd23f" />
        <polygon points="0.8,16 6.4,16 6.4,13.4" fill="#ff9f1c" />
        <polygon points="5.3,5.3 7.4,11.1 9.2,9.2" fill="#ffd23f" />
        <polygon points="5.3,5.3 9.2,9.2 11.1,7.4" fill="#ff9f1c" />
      </svg>
    </button>

    <!-- 悬停时显示物件名字的标签 -->
    <div id="label"></div>

    <!-- type="module" 让这个文件可以使用 import -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
