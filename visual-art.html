<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backpack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // 网址带 ?played=1,说明不是第一次进这个页面了,在页面内容画出来之前
      // 就先给 <html> 打上标记,下面的CSS会靠这个标记跳过所有弹出/切换动画
      if (new URLSearchParams(location.search).get("played") === "1") {
        document.documentElement.classList.add("no-replay");
      }
    </script>
    <style>
      .art-page {
        max-width: 100%;
        width: 100%;
        text-align: center;
      }

      .backpack-stage {
        position: relative;
        width: 100%;
        height: 80vh;
        min-height: 480px;
        margin-top: 16px;
        overflow: visible;
      }

      .bp-item {
        position: absolute;
        top: 50%;
        left: 50%;
      }

      .bp-item svg {
        display: block;
        width: auto;
        overflow: visible;
      }

      .bp-svg-closed {
        height: 340px;
      }

      .bp-svg-open {
        height: 340px;
      }

      .bp-svg-camera {
        height: 80px;
      }

      .bp-svg-headphone {
        height: 100px;
      }
      .bp-svg-computer {
        height: 250px;
      }

      .bp-svg-journal {
        height: 200px;
      }

      /* 关着的书包: 先弹入,停留一下,然后瞬间消失(72%那一步直接跳到opacity:0,不淡出) */
      #bp-closed {
        animation: bp-closed-life 1.5s forwards;
      }
      @keyframes bp-closed-life {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
          animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          animation-timing-function: steps(1, end);
        }
        33% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        35% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }
        100% {
          opacity: 0;
        }
      }

      /* 开着的书包: 在关着的书包消失的同一时间点(35%)突然弹出来 */
      #bp-open {
        animation: bp-open-life 1.5s forwards;
      }
      @keyframes bp-open-life {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
        }
        33% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
          animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        53% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /* 四件物品: 从书包中心弹出来,散落到周围围成一圈的位置 */
      .bp-orbit {
        opacity: 0;
        cursor: pointer;
        animation: bp-orbit-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* 四个物品是链接,鼠标移上去整只图形发光+微微放大,提示能点 */
      .bp-orbit svg {
        transition: filter 0.2s ease, transform 0.2s ease;
      }

      .bp-orbit:hover svg {
        filter: drop-shadow(0 0 14px #ff2ec4);
        transform: scale(1.08);
      }
      @keyframes bp-orbit-pop {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2);
        }
        to {
          opacity: 1;
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
            scale(1);
        }
      }

      /* 不是第一次进这个页面: 跳过所有动画,直接停在动画结束时该有的样子 */
      html.no-replay #bp-closed {
        animation: none;
        opacity: 0;
      }
      html.no-replay #bp-open {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      html.no-replay .bp-orbit {
        animation: none;
        opacity: 1;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
          scale(1);
      }
    </style>
  </head>
